apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.naman14.androidlame'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 3
        versionName "2.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles.add(file("proguard-rules.pro"))
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    publishing {
        singleVariant('release')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// JitPack resolves this module as com.github.zubinraja.ThAndroidLame:androidlame:<tag>
// (see https://docs.jitpack.io multi-module convention: com.github.User.Repo:Module:Tag).
// The exact groupId/version below only matter for local `publishToMavenLocal` testing;
// JitPack re-serves the built artifact under the GitHub-derived coordinates regardless.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.zubinraja.ThAndroidLame'
                artifactId = 'androidlame'
                version = android.defaultConfig.versionName
            }
        }
    }
}

